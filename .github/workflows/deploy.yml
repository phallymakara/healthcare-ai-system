name: CI/CD — Build, Test & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # CI only (test) — no deploy on PRs

# Cancel any in-progress runs for the same branch to avoid race conditions
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Environment variables shared across jobs
# ─────────────────────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/healthcare-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/healthcare-frontend

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Run Backend Tests
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: healthcare_ai_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: healthcare_ai_db_test
        run: alembic upgrade head

      - name: Create local uploads directory
        run: sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads

      - name: Seed test data
        working-directory: backend
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: healthcare_ai_db_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          AZURE_STORAGE_CONNECTION_STRING: ""
          MICROSOFT_FOUNDRY_API_KEY: ""
          MICROSOFT_FOUNDRY_BASE_URL: ""
        run: python -m scripts.seed_test_data

      - name: Run pytest
        working-directory: backend
        env:
          ENVIRONMENT: test
          DEBUG: "true"
          SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: healthcare_ai_db_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          # Azure / AI keys — stubbed in CI
          AZURE_STORAGE_CONNECTION_STRING: ""
          MICROSOFT_FOUNDRY_API_KEY: ""
          MICROSOFT_FOUNDRY_BASE_URL: ""
        # Skip test_assistant_chat_guidance — requires a real OpenAI API key
        run: pytest tests/ -v --tb=short -k "not test_assistant_chat_guidance"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker Images to GHCR
  # Only runs on pushes to main (not PRs)
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # Required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──
      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──
      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          build-args: |
            VITE_PATIENT_URL=${{ secrets.VITE_PATIENT_URL }}
            VITE_PARTNER_URL=${{ secrets.VITE_PARTNER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Azure VM via SSH
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          # Script runs directly on the Azure VM:
          script: |
            set -e
            echo "── Navigating to project directory ──"
            cd /opt/apps/healthcare-ai-system

            echo "── Pulling latest code ──"
            git pull origin main

            echo "── Logging in to GHCR ──"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            echo "── Pulling latest images ──"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "── Restarting services (zero-downtime) ──"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "── Cleaning up dangling images ──"
            docker image prune -f

            echo "── Deployment complete ──"
