# Healthcare AI System — Nginx Configuration
# Serves React SPA and proxies API/WebSocket to backend

upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # ----- Serve React SPA (static files) -----
    root /usr/share/nginx/html;
    index index.html;

    # ----- Maintenance Mode & Error Handling -----
    # 1. Manual switch: check if maintenance.enable flag exists
    set $maintenance 0;
    if (-f /usr/share/nginx/html/maintenance.enable) {
        set $maintenance 1;
    }

    # 2. Automatically display custom maintenance page for 502, 503, 504
    error_page 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # SPA fallback: serve index.html for all non-file routes
    location / {
        if ($maintenance = 1) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
    }

    # ----- Serve locally-uploaded assets (fallback when Azure Storage is not configured) -----
    # Files are written by the backend to /app/uploads and served here via a shared Docker volume.
    # NOTE: ^~ modifier is required so this prefix location takes priority over the catch-all
    # regex location (~* \.(png|jpg|...)) below, which would otherwise intercept image requests
    # before this alias can redirect them to /app/uploads/, causing 404 errors.
    location ^~ /assets/uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ----- Reverse Proxy: REST API -----
    location /api/ {
        if ($maintenance = 1) {
            error_page 503 =503 @api_maintenance;
            return 503;
        }

        proxy_pass http://backend_api/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI requests
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Intercept backend downtime/errors (502, 503, 504) and return clean JSON
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @api_maintenance;
    }

    # Clean JSON response for API consumers during maintenance or backend downtime
    location @api_maintenance {
        default_type application/json;
        add_header Retry-After 15 always;
        return 503 '{"status":"maintenance","error":"SERVICE_UNAVAILABLE","message":"The healthcare system is currently undergoing scheduled maintenance or server updates. Please try again shortly.","retry_after_seconds":15}';
    }

    location = /api {
        return 301 /api/;
    }

    # ----- Reverse Proxy: WebSocket -----
    location /ws/ {
        if ($maintenance = 1) {
            return 503;
        }
        proxy_pass http://backend_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /ws {
        return 301 /ws/;
    }

    # ----- Reverse Proxy: FastAPI docs -----
    location /docs {
        proxy_pass http://backend_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://backend_api/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://backend_api/openapi.json;
        proxy_set_header Host $host;
    }

    # ----- Gzip compression -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ----- Security headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ----- Cache static assets -----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
