<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Under Maintenance — ម៉ាស៊ីនមេកំពុងស្ថិតក្រោមការថែទាំ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-main: 'Kantumruy Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-primary: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
      --accent-primary: #185339;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }

    .maintenance-content {
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      height: 64px;
      width: auto;
      object-fit: contain;
      margin-bottom: 2rem;
    }

    /* Big Text: Server Under Maintenance (Khmer on top, English below) */
    .title-km {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 0.35rem;
    }

    .title-en {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }

    /* Normal Text: We will be back soon (Khmer on top, English below) */
    .subtitle-km {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 0.25rem;
    }

    .subtitle-en {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    /* Countdown timer */
    .countdown-km {
      font-size: 0.95rem;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .countdown-en {
      font-size: 0.9rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .countdown-number {
      font-weight: 700;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="maintenance-content">
    <img src="/assets/ProsethBot.png" alt="Proseth Healthcare AI" class="brand-logo" onerror="this.style.display='none'" />

    <!-- Big Text: Server Under Maintenance -->
    <h1 class="title-km">ម៉ាស៊ីនមេកំពុងស្ថិតក្រោមការថែទាំ</h1>
    <div class="title-en">Server Under Maintenance</div>

    <!-- Normal Text: We will be back soon -->
    <p class="subtitle-km">យើងនឹងត្រឡប់មកវិញក្នុងពេលឆាប់ៗនេះ</p>
    <p class="subtitle-en">We will be back soon</p>

    <!-- Countdown Timer -->
    <div class="countdown-km">
      ពិនិត្យឡើងវិញដោយស្វ័យប្រវត្តិក្នុ​ងរយៈពេល <span class="countdown-number" id="timerKm">10</span> វិនាទី
    </div>
    <div class="countdown-en">
      Auto-refreshing in <span class="countdown-number" id="timerEn">10</span> seconds
    </div>
  </div>

  <script>
    var seconds = 10;
    var timerKm = document.getElementById('timerKm');
    var timerEn = document.getElementById('timerEn');

    function checkServer() {
      fetch('/api/v1/health', { cache: 'no-store' })
        .then(function(res) {
          if (res.ok) {
            window.location.reload();
          } else {
            seconds = 10;
          }
        })
        .catch(function() {
          seconds = 10;
        });
    }

    setInterval(function() {
      seconds--;
      if (timerKm) timerKm.textContent = seconds;
      if (timerEn) timerEn.textContent = seconds;
      if (seconds <= 0) {
        checkServer();
      }
    }, 1000);
  </script>
</body>
</html>
