# ==============================================================================
# Healthcare AI System — Full Stack Docker Compose
# ==============================================================================
# All ports are configurable via .env file to avoid conflicts with other
# projects running on the same VM.
#
# Default ports:
#   Frontend (Nginx): 9080
#   Backend  (API):   9000 (direct access, optional — Nginx proxies internally)
#   PostgreSQL:       5440
#   Redis:            6380
#
# Usage:
#   docker-compose up --build -d        # Start all services
#   docker-compose logs -f              # Follow all logs
#   docker-compose logs -f backend      # Follow backend logs only
#   docker-compose down                 # Stop all services
#   docker-compose down -v              # Stop + remove volumes (data reset)
# ==============================================================================

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_ai_db}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healthcare_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_net

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_net

  # ============================================================
  # Backend — FastAPI Application
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Healthcare AI System}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_ai_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      LANGGRAPH_CHECKPOINT_DATABASE_URL: ${LANGGRAPH_CHECKPOINT_DATABASE_URL:-}
      SEED_DATA: ${SEED_DATA:-false}
      MICROSOFT_FOUNDRY_API_KEY: ${MICROSOFT_FOUNDRY_API_KEY:-}
      MICROSOFT_FOUNDRY_BASE_URL: ${MICROSOFT_FOUNDRY_BASE_URL:-}
      MICROSOFT_FOUNDRY_MODEL: ${MICROSOFT_FOUNDRY_MODEL:-gpt-4o}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-publicprofile}
      AZURE_STORAGE_CUSTOM_DOMAIN: ${AZURE_STORAGE_CUSTOM_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - healthcare_net

  # ============================================================
  # Frontend — Nginx + React SPA
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PATIENT_URL: ${VITE_PATIENT_URL}
        VITE_PARTNER_URL: ${VITE_PARTNER_URL}
    container_name: healthcare_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9080}:80"
    volumes:
      - uploads_data:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - healthcare_net

# ============================================================
# Volumes & Networks
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  healthcare_net:
    driver: bridge
